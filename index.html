<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кино Поиск Web App</title>
    <!-- Подключаем скрипт Telegram для интеграции -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18181b);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: var(--tg-theme-hint-color, #38bdf8); }
        input {
            width: 80%;
            padding: 12px;
            border: 2px solid #3f3f46;
            border-radius: 8px;
            background-color: #27272a;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            width: 86%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #38bdf8);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .error { color: #ef4444; margin-top: 10px; display: none; }
        .player-container {
            width: 100%;
            margin-top: 20px;
            display: none;
        }
        iframe {
            width: 100%;
            height: 250px;
            border: none;
            border-radius: 8px;
            background: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🍿 Поиск фильма по коду</h2>
    <input type="text" id="movieCode" placeholder="Введите код фильма">
    <button onclick="searchMovie()">Смотреть фильм</button>
    <div class="error" id="errorMsg">❌ Фильм с таким кодом не найден!</div>

    <!-- Контейнер с плеером, куда загрузится сайт с фильмом -->
    <div class="player-container" id="playerBox">
        <h3 id="movieTitle"></h3>
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
    </div>
</div>

<script>
    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Разворачиваем окно на максимум

    // База фильмов прямо внутри Web App для мгновенной проверки
    const moviesDatabase = {
        "123": {
            title: "Начало (2010)",
            url: "https://volk-s-wall-streete-lordfilm.ru/film/nachalo-2010/"
        }
    };

    function searchMovie() {
        const code = document.getElementById('movieCode').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const playerBox = document.getElementById('playerBox');
        const videoPlayer = document.getElementById('videoPlayer');
        const movieTitle = document.getElementById('movieTitle');

        if (moviesDatabase[code]) {
            errorMsg.style.display = 'none';
            movieTitle.innerText = moviesDatabase[code].title;
            // Устанавливаем ссылку на плеер/сайт фильма
            videoPlayer.src = moviesDatabase[code].url;
            playerBox.style.display = 'block';
        } else {
            playerBox.style.display = 'none';
            videoPlayer.src = '';
            errorMsg.style.display = 'block';
        }
    }
</script>
</body>
</html>
