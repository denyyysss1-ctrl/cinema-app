<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kino Web App</title>
    <!-- ИСПРАВЛЕНО: Правильный и точный адрес библиотеки Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-top: 50px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #3f3f46;
            border-radius: 8px;
            background-color: #27272a;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .btn-search {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #ef4444;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }

        .result-container {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background-color: #27272a;
            border-radius: 8px;
            border: 1px solid #3f3f46;
            display: none;
            box-sizing: border-box;
        }

        .movie-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-watch {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            background-color: #22c55e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Фильмы по коду</h2>
        <input type="text" id="movieCode" placeholder="Введите код фильма" onkeydown="if(event.key === 'Enter') { event.preventDefault(); searchMovie(); }">
        <button type="button" class="btn-search" onclick="searchMovie()">Найти фильм</button>
        <div class="error" id="errorMsg">Фильм с таким кодом не найден</div>
        
        <div class="result-container" id="resultBox">
            <div class="movie-title" id="movieTitle"></div>
            <a href="#" id="watchLink" class="btn-watch">Смотреть онлайн</a>
        </div>
    </div>

<script>
    // Теперь этот блок выполнится без ошибок, так как скрипт Telegram подключен верно
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    // База данных с вашим фильмом по умолчанию
    let moviesDatabase = {
        "123": {
            "title": "Начало (2010)",
            "url": "https://volk-s-wall-streete-lordfilm.ru/film/nachalo-2010/"
        }
    };

    // Автоматически дополняем список фильмов, если их передал бот в ссылку
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const moviesData = urlParams.get('movies');
        if (moviesData) {
            const incomingMovies = JSON.parse(decodeURIComponent(moviesData));
            moviesDatabase = Object.assign({}, moviesDatabase, incomingMovies);
        }
    } catch (e) {
        console.error("Ошибка при получении базы фильмов:", e);
    }

    function searchMovie() {
        const code = document.getElementById('movieCode').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('resultBox');
        const watchLink = document.getElementById('watchLink');
        const movieTitle = document.getElementById('movieTitle');

        if (moviesDatabase[code]) {
            errorMsg.style.display = 'none';
            movieTitle.innerText = moviesDatabase[code].title;
            watchLink.href = moviesDatabase[code].url;

            // Обработка перехода по ссылке
            watchLink.onclick = function(e) {
                // Если открыто внутри Telegram
                if (tg && typeof tg.openLink === 'function') {
                    e.preventDefault();
                    tg.openLink(moviesDatabase[code].url);
                } 
                // Если тестируете локально в обычном браузере
                else {
                    watchLink.target = "_blank";
                }
            };

            resultBox.style.display = 'block';
        } else {
            resultBox.style.display = 'none';
            errorMsg.style.display = 'block';
        }
    }
</script>
</body>
</html>
